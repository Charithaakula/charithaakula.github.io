<svg xmlns="http://www.w3.org/2000/svg" width="180" height="160" viewBox="0 0 180 160" role="img" aria-labelledby="title description">
  <title id="title">ReconcileBench</title>
  <desc id="description">Scientific state reconciliation keeps evidence, analysis, records, and decisions consistent after a change.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 6 3 0 6" fill="#6b7280" />
    </marker>
  </defs>
  <rect width="180" height="160" fill="#fff" />
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="90" y="18" fill="#1772d0" font-size="14" font-weight="700">ReconcileBench</text>
    <text x="90" y="31" fill="#666" font-size="8">Persistent scientific agents</text>
    <g fill="#f0f0ff" stroke="#d4d4e3">
      <rect x="29" y="42" width="122" height="20" rx="4" />
      <rect x="29" y="68" width="122" height="20" rx="4" />
      <rect x="29" y="94" width="122" height="20" rx="4" />
      <rect x="29" y="120" width="122" height="20" rx="4" />
    </g>
    <g stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)">
      <path d="M90 62v5" />
      <path d="M90 88v5" />
      <path d="M90 114v5" />
    </g>
    <g fill="#374151" font-size="10">
      <text x="90" y="55">Evidence</text>
      <text x="90" y="81">Analysis</text>
      <text x="90" y="107">Record</text>
      <text x="90" y="133">Decision</text>
    </g>
    <text x="90" y="153" fill="#666" font-size="7.5">Keep the scientific record valid</text>
  </g>
</svg>
